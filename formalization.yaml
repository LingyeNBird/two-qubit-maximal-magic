    Quantum Problems catalogue (jpbruneton/open_quantum_problems, issue #26) independently rebuilt
    and verified the degree-8 B₆⁺-symmetrized SOS certificate with separate code and recorded the
    result on openquantumproblems.com/p/E28 without re-running the Lean build.

