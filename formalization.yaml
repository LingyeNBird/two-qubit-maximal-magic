fidelity:
  divergences: >-
    sre uses the natural logarithm Real.log rather than log_2; dividing both sides of the SRE
    inequalities by Real.log 2 recovers the base-2 convention, and the underlying Pauli-moment
    bounds (pauli_fourth_moment_lower_bound, pauli_moment_lower_bound_all_alpha) are logarithm-free.
    IsPauliMUBFiducial uses the multi-qubit Pauli (product Weyl–Heisenberg) group P_2 = {I,X,Y,Z}^⊗2
    as in Liu–Low–Yin (2026), rather than the cyclic Z_4 Weyl–Heisenberg group.

