version: "v0.4"

project:
  name: "Rigorous Resolution of the Two-Qubit Maximal Magic Conjecture"
  description: >-
    Pure-kernel Lean 4 formalization resolving the two-qubit (n = 2) maximal magic conjecture of
    Liu, Low, and Yin (Quantum Sci. Technol. 11, 015035, 2026; Open Quantum Problem E28) for all
    Stabilizer Rényi Entropy (SRE) orders α ≥ 2. Using the SU(4) ≅ Spin(6) reduction onto the
    positively oriented skew-orthogonal manifold in SO(6) and an exact degree-8 B₆⁺-equivariant
    rational sum-of-squares certificate verified by definitional equality inside Lean's kernel, the
    formalization proves the sharp upper bound M_α(|ψ⟩) ≤ (1/(1-α)) log((1 + 3·4^(1-α))/4)
    (in particular max M_2 = log(16/7)), proves attainment by |ψ_MUB⟩ = (1/2)(1, 1, 1, i),
    classifies all maximizers as a single two-qubit Clifford orbit of exact cardinality 480
    coinciding with the two-qubit Pauli 5-MUB fiducial states, and proves the exact Wootters
    concurrence dichotomy C ∈ {1/2, 1/√2} with 192 / 288 state counts.
    AI-assistance disclosure: the bulk of the technical work (proof discovery, SOS certificate
    pipeline, Lean 4 formalization, and manuscript drafting) was carried out using AI systems under
    the author's problem selection, direction, and oversight; mathematical correctness rests on
    Lean 4's kernel verification and the standalone exact-integer Python certificate verifier.
  authors:
    - "Zhaoting Ye"
  license: "MIT"
  responsible_maintainers:
    - "Zhaoting Ye"

