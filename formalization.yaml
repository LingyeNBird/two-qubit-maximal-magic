status:
  scope: >-
    Formalizes in full the n = 2 case of Open Quantum Problem E28 for all Rényi orders α ≥ 2:
    sharp upper bound, attainment, Pauli-spectrum criterion, single two-qubit Clifford orbit,
    exact cardinality 480 of maximizer density matrices, equivalence with two-qubit Pauli 5-MUB
    fiducials, and exact 192 / 288 Wootters concurrence split C ∈ {1/2, 1/√2}. Higher-qubit cases
    (n ≥ 4) of E28, orders α < 2, and non-Pauli cyclic Z_4 displacement groups are not addressed here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

