name: Lean 4 Build & Axiom Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan & Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build Lean 4 proof
        run: lake build

      - name: Run Audit.lean & verify standard axioms only
        run: |
          lake env lean Audit.lean | tee audit.out
          python3 - <<'EOF'
          import re, sys
          text = open("audit.out").read()
          matches = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text, flags=re.S)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          print(f"Audited theorems: {len(matches)}")
          assert len(matches) == 32, f"Expected 32 audited theorems, got {len(matches)}"
          for name, ax_str in matches:
              axs = {a.strip() for a in ax_str.split(",") if a.strip()}
              bad = axs - allowed
              assert not bad, f"{name} uses non-standard axioms: {bad}"
          print("All 32 audited theorems depend solely on standard Lean axioms.")
          EOF

      - name: Verify zero sorry/native_decide/custom axioms in source code
        run: |
          python3 - <<'EOF'
          import pathlib, re
          pattern = re.compile(r"\b(sorry|axiom|native_decide|unsafe|implemented_by|extern)\b")
          files = [pathlib.Path("TwoQubitMaximalMagic.lean")] + sorted(pathlib.Path("TwoQubitMaximalMagic").glob("*.lean"))
          hits = []
          for p in files:
              in_block = False
              for lineno, line in enumerate(p.read_text().splitlines(), 1):
                  s = line
                  # Strip block comments /- ... -/ and line comments -- ...
                  out = []
                  i = 0
                  while i < len(s):
                      if in_block:
                          if s[i:i+2] == "-/":
                              in_block = False
                              i += 2
                          else:
                              i += 1
                      else:
                          if s[i:i+2] == "/-":
                              in_block = True
                              i += 2
                          elif s[i:i+2] == "--":
                              break
                          else:
                              out.append(s[i])
                              i += 1
                  code = "".join(out)
                  if pattern.search(code):
                      hits.append(f"{p}:{lineno}: {line}")
          assert not hits, "Forbidden keywords found in code:\n" + "\n".join(hits)
          print(f"Zero forbidden keywords across {len(files)} Lean source files.")
          EOF
